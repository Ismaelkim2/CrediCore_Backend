
# ===============================
# SERVER CONFIG
# ===============================
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

# ===============================
# DATASOURCE CONFIG
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/credit_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# CONNECTION POOL
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1

# ===============================
# TWILIO CONFIG
# ===============================
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.phone.number=${TWILIO_PHONE_NUMBER:}

twilio.enabled=${TWILIO_ENABLED:false}
otp.enabled=false

# ===============================
# EMAIL CONFIGURATION
# ===============================
email.enabled=${EMAIL_ENABLED:false}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# APPLICATION PROFILES
# ===============================
# Do not force a deployment-specific profile here.
# Configure SPRING_PROFILES_ACTIVE in the environment if required.

# ===============================
# MPESA
# ===============================
mpesa.mode=${MPESA_MODE:real}

# ===============================
# FILE UPLOAD CONFIG
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

app.upload.property-images-dir=uploads/properties
app.upload.tenant-images-dir=uploads/tenants

# ===============================
# TENANT REMINDERS
# ===============================
tenant.reminders.automation.enabled=false
tenant.reminders.automation.cron=0 0 8 * * *
tenant.reminders.automation.actor=
tenant.reminders.delivery.enabled=false
tenant.reminders.delivery.delay-ms=30000

# ===============================
# LOGGING
# ===============================
logging.level.root=info
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
