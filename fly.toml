app = "credit-management"
primary_region = "sin"

[build]
dockerfile = "Dockerfile"

[env]
SPRING_PROFILES_ACTIVE = "prod"

[[services]]
internal_port = 8080
protocol = "tcp"

[[services.ports]]
port = 80
handlers = ["http"]

[[services.ports]]
port = 443
handlers = ["tls", "http"]

[[services.tcp_checks]]
interval = "15s"
timeout = "2s"
grace_period = "30s"
